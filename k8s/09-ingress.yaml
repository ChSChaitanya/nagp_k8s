# Ingress for exposing Service API Tier externally
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: service-api-ingress
  labels:
    app: nagp-assignment
    tier: api
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: service-api
                port:
                  number: 80
 
