# PostgreSQL ClusterIP Service
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  labels:
    app: nagp-assignment
    tier: database
spec:
  type: ClusterIP
  selector:
    app: postgres
    tier: database
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
