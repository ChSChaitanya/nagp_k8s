apiVersion: v1
kind: ConfigMap
metadata:
  name: db-config
  labels:
    app: nagp-assignment
    tier: config
data:
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "nagpdb"
  DB_USER: "nagpuser"
  # Connection pool settings for optimal performance
  DB_POOL_MIN_CONN: "1"
  DB_POOL_MAX_CONN: "10"
