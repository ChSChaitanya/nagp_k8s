# Service API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-api
  labels:
    app: nagp-assignment
    tier: api
spec:
  replicas: 4
  selector:
    matchLabels:
      app: service-api
      tier: api
  # Rolling Update Strategy for zero-downtime deployments
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1         # Max 1 extra pod during update
      maxUnavailable: 1   # Max 1 pod unavailable during update
  template:
    metadata:
      labels:
        app: service-api
        tier: api
    spec:
      containers:
        - name: service-api
          image: y6bt250/nagp-service-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http
          # Environment variables from ConfigMap
          envFrom:
            - configMapRef:
                name: db-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: "100m"       # 0.1 CPU cores minimum
              memory: "128Mi"  # 128MB memory minimum
            limits:
              cpu: "500m"      # 0.5 CPU cores maximum
              memory: "256Mi"  # 256MB memory maximum
